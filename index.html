<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외영업관리 포트폴리오</title>
<meta name="description" content="해외영업관리 경력 및 증빙자료 포트폴리오">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     디자인 토큰 (색상/여백/모션) — 여기 값만 바꿔도 전체 톤이 바뀝니다
     ========================================================= */
  :root {
    --status-dot: #2E7D46;

    --bg-base: #FFFFFF;
    --bg-elevated: #FFFFFF;
    --bg-subtle: #F2F3F8;
    --bg-overlay: #E7E9F1;

    --text-primary: #16192B;
    --text-secondary: #4B4E63;
    --text-tertiary: #9497A8;
    --text-on-primary: #FFFFFF;

    --border-subtle: #E4E5EE;
    --border-default: #C9CBDA;

    --color-primary-50: #EDEFF7;
    --color-primary-100: #D6DAEF;
    --color-primary-200: #ADB4DE;
    --color-primary-300: #7F89C4;
    --color-primary-500: #1F2A5C;
    --color-primary-600: #19224A;
    --color-primary-700: #141B3A;
    --color-primary-800: #0F142B;
    --color-primary-900: #0A0D1C;

    --color-success-bg: #E7F1EA;
    --color-success-text: #1F6B3A;
    --color-warning-bg: #FBF0E4;
    --color-warning-text: #8A5A1E;

    --radius-sm: 3px;
    --radius-md: 6px;
    --radius-full: 999px;
    --shadow-xl: 0 24px 44px -30px rgba(0, 0, 0, .22);
    --shadow-md: 0 8px 18px -12px rgba(0, 0, 0, .16);

    --duration-fast: 140ms;
    --duration-base: 280ms;
    --ease-out: cubic-bezier(.2,.8,.2,1);
    --ease-in-out: cubic-bezier(.4,0,.2,1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --status-dot: #4CAF6B;

      --bg-base: #0B0B0B;
      --bg-elevated: #141414;
      --bg-subtle: #191919;
      --bg-overlay: #232323;

      --text-primary: #F2F2F0;
      --text-secondary: #B7B7B2;
      --text-tertiary: #7C7C77;
      --text-on-primary: #0B0B0B;

      --border-subtle: #292927;
      --border-default: #3A3A36;

      --color-primary-50: #171B30;
      --color-primary-100: #1E2440;
      --color-primary-200: #2B3459;
      --color-primary-300: #3C4A7C;
      --color-primary-500: #8993D6;
      --color-primary-600: #A3ACE0;
      --color-primary-700: #BDC4EA;
      --color-primary-800: #D6DAF3;
      --color-primary-900: #EDEFF9;

      --color-success-bg: #16301F;
      --color-success-text: #6FCB8B;
      --color-warning-bg: #362811;
      --color-warning-text: #E8B96A;
    }
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Roboto', 'Noto Sans KR', sans-serif;
    color: var(--text-primary);
    background: var(--bg-base);
    -webkit-font-smoothing: antialiased;
  }
  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  ul { margin: 0; padding: 0; list-style: none; }
  section { scroll-margin-top: 84px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* ---------- 버튼 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 50px; padding: 0 28px; border-radius: var(--radius-sm);
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; cursor: pointer;
    border: 1px solid var(--text-primary); transition: background var(--duration-fast) linear, color var(--duration-fast) linear, border-color var(--duration-fast) linear;
  }
  .btn-primary { background: var(--text-primary); color: var(--bg-base); }
  .btn-primary:hover { background: var(--color-primary-500); border-color: var(--color-primary-500); }
  .btn-secondary { border: 1px solid var(--border-default); background: transparent; color: var(--text-primary); }
  .btn-secondary:hover { border-color: var(--text-primary); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }

  /* ---------- 상단 네비게이션 ---------- */
  .site-nav {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg-base) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border-subtle);
  }
  .site-nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 68px; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; }
  .brand-mark {
    width: 34px; height: 34px; display: grid; place-items: center;
    border-radius: 8px; background: var(--color-primary-500);
    color: #FFFFFF; font-family: 'Playfair Display', 'Georgia', serif; font-weight: 700; font-size: 15px; letter-spacing: 0;
  }
  .brand-name { font-weight: 700; }
  .brand-role { display: block; color: var(--text-tertiary); font-size: 10.5px; font-weight: 500; letter-spacing: .3px; text-transform: uppercase; }

  .nav-links { display: flex; align-items: center; gap: 2px; }
  .nav-links a {
    padding: 9px 13px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
    color: var(--text-secondary); transition: background var(--duration-fast) linear, color var(--duration-fast) linear;
  }
  .nav-links a:hover, .nav-links a.is-active { background: var(--bg-subtle); color: var(--text-primary); }

  .nav-status {
    display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px;
    border: 1px solid var(--border-default); border-radius: var(--radius-full);
    font-size: 11px; font-weight: 600; letter-spacing: .2px; color: var(--text-secondary); white-space: nowrap;
  }
  .nav-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--status-dot); }

  .nav-toggle { display: none; width: 40px; height: 40px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: var(--bg-elevated); cursor: pointer; }
  .nav-toggle svg { width: 20px; height: 20px; margin: 0 auto; }

  .print-btn {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px;
    border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: transparent;
    color: var(--text-secondary); font-family: inherit; font-size: 11.5px; font-weight: 700; letter-spacing: .3px;
    text-transform: uppercase; cursor: pointer; white-space: nowrap;
    transition: border-color var(--duration-fast) linear, color var(--duration-fast) linear;
  }
  .print-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }
  .print-btn svg { width: 15px; height: 15px; flex: none; }
  @media (max-width: 520px) {
    .print-btn { padding: 0 10px; }
  }

  /* ---------- HERO ---------- */
  .hero {
    position: relative; max-width: 1180px; margin: 0 auto; overflow: hidden;
    border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-subtle);
  }
  .hero-stage {
    padding: 48px 6% 40px; display: grid;
    grid-template-columns: minmax(0,1.1fr) minmax(300px,.85fr);
    align-items: center; gap: 8%;
  }
  .hero-copy h1 { max-width: 660px; margin: 0; font-size: clamp(32px,4.6vw,52px); font-weight: 800; line-height: 1.2; letter-spacing: -1px; }
  .hero-copy h1 em { color: var(--color-primary-500); font-style: normal; }
  .hero-copy p { max-width: 520px; margin: 22px 0 30px; color: var(--text-secondary); font-size: 15.5px; line-height: 1.75; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }

  .hero-card {
    width: min(100%,420px); justify-self: end;
    border: 1px solid var(--text-primary);
    background: var(--bg-elevated);
  }
  .hero-card-top {
    height: 40px; padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
    background: var(--color-primary-500); color: #FFFFFF; font-size: 10.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
  }
  .hero-headline {
    padding: 26px 20px 22px; border-bottom: 1px solid var(--border-subtle);
  }
  .hero-headline-inner strong { display: block; font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -1px; color: var(--text-primary); }
  .hero-headline-inner span { display: block; margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-tertiary); }

  .hero-stats { display: grid; grid-template-columns: 1fr 1fr; }
  .hero-stat {
    padding: 18px 20px; display: flex; flex-direction: column; gap: 6px;
    border-top: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); color: var(--text-secondary);
  }
  .hero-stat:last-child { border-right: 0; }
  .hero-stat strong { display: block; font-size: 16px; font-weight: 700; line-height: 1.3; color: var(--text-primary); }
  .hero-stat small { display: block; margin-top: 5px; font-size: 10.5px; font-weight: 600; letter-spacing: .3px; text-transform: uppercase; color: var(--text-tertiary); }

  .hero-tags {
    padding: 16px 20px; border-top: 1px solid var(--border-subtle);
  }
  .hero-tags b { display: block; margin-bottom: 10px; font-size: 10.5px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .8px; }
  .hero-tag-list { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-tag-list span { padding: 6px 11px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 11px; font-weight: 600; }

  /* ---------- 공통 섹션 헤더 ---------- */
  .section { padding: 56px 0 0; }
  .section-head { max-width: 640px; margin: 0 auto 32px; text-align: center; }
  .section-eyebrow { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 14px; color: var(--color-primary-500); font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
  .section-eyebrow::before, .section-eyebrow::after { content: ""; width: 24px; height: 1px; background: var(--border-default); }
  .section-head h2 { margin: 0; font-size: clamp(24px,3vw,32px); font-weight: 800; letter-spacing: -.4px; }
  .section-head p { margin: 12px 0 0; color: var(--text-secondary); font-size: 14.5px; line-height: 1.7; }

  /* ---------- 핵심 역량 카드 ---------- */
  .competency-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 0; border: 1px solid var(--border-subtle); border-bottom: 0; }
  .competency-card {
    position: relative; padding: 22px 22px; border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-elevated); transition: background var(--duration-fast) linear;
  }
  .competency-card:last-child { border-right: 0; }
  .competency-card:hover { background: var(--bg-subtle); }
  .competency-index { display: block; margin-bottom: 20px; font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--text-tertiary); }
  .competency-icon {
    width: 40px; height: 40px; display: grid; place-items: center; margin-bottom: 18px;
    color: var(--text-primary);
  }
  .competency-icon svg { width: 26px; height: 26px; }
  .competency-card h3 { margin: 0 0 10px; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .competency-card p { margin: 0; color: var(--text-secondary); font-size: 13.5px; line-height: 1.65; }

  /* ---------- 경력 타임라인 ---------- */
  .timeline { max-width: 820px; margin: 0 auto; border-top: 1px solid var(--border-subtle); }
  .timeline-item {
    position: relative; padding: 20px 0 20px 168px; border-bottom: 1px solid var(--border-subtle);
  }
  .timeline-period {
    position: absolute; left: 0; top: 20px; width: 148px;
    font-size: 12.5px; font-weight: 700; letter-spacing: .2px; color: var(--text-tertiary); font-variant-numeric: tabular-nums;
  }
  .timeline-item h3 { margin: 0 0 3px; font-size: 17px; font-weight: 700; }
  .timeline-item .timeline-role { display: block; margin-bottom: 10px; color: var(--color-primary-500); font-size: 12px; font-weight: 700; letter-spacing: .2px; text-transform: uppercase; }
  .timeline-item ul { display: flex; flex-direction: column; gap: 5px; }
  .timeline-item li { position: relative; padding-left: 16px; color: var(--text-secondary); font-size: 13.5px; line-height: 1.5; }
  .timeline-item li::before { content: "—"; position: absolute; left: 0; top: 0; color: var(--text-tertiary); }
  .timeline-sub { margin-top: 5px; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .timeline-sub li { font-size: 12.5px; color: var(--text-secondary); }
  .timeline-sub li::before { content: "·"; }
  .timeline-sub .timeline-sub { margin-top: 4px; }
  .timeline-sub .timeline-sub li { font-size: 12px; color: var(--text-tertiary); }
  .timeline-sub .timeline-sub li::before { content: "-"; }
  @media (max-width: 640px) {
    .timeline-item { padding-left: 0; padding-top: 46px; }
    .timeline-period { position: static; display: block; margin-bottom: 8px; }
  }

  /* ---------- 증빙자료 (핵심 성과 카드에 자료를 붙일 때 재사용할 수 있도록 스타일은 남겨둡니다) ---------- */
  .evidence-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 0; border: 1px solid var(--border-subtle); border-bottom: 0; border-right: 0; }
  .evidence-card {
    display: flex; flex-direction: column; padding: 20px; border-right: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    background: var(--bg-elevated); transition: background var(--duration-fast) linear;
  }
  .evidence-card:hover { background: var(--bg-subtle); }
  .evidence-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .evidence-icon { flex: 0 0 auto; color: var(--text-primary); }
  .evidence-icon svg { width: 22px; height: 22px; }
  .evidence-category { color: var(--color-primary-500); font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  .evidence-card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; letter-spacing: -.1px; }
  .evidence-meta { margin: 0 0 10px; color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .evidence-card p { margin: 0; flex: 1; color: var(--text-secondary); font-size: 13.5px; line-height: 1.6; }
  .evidence-footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-subtle); }
  .evidence-link { display: inline-flex; align-items: center; gap: 6px; color: var(--text-primary); font-size: 12px; font-weight: 700; letter-spacing: .2px; text-transform: uppercase; }
  .evidence-link svg { width: 14px; height: 14px; }
  .evidence-pending { display: inline-flex; align-items: center; gap: 6px; color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; letter-spacing: .2px; text-transform: uppercase; }

  /* ---------- 업무 자료 (증빙자료 카드 스타일 재사용) ---------- */
  .work-gallery-heading { margin: 40px 0 16px; font-size: 12px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .8px; }
  .work-card { cursor: pointer; }
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 200; padding: 40px;
    background: rgba(10,11,20,.88); align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  }
  .lightbox.is-open { display: flex; }
  .lightbox img { max-width: min(100%, 1100px); max-height: 78vh; object-fit: contain; border-radius: 2px; }
  .lightbox-caption { color: #EDEFF7; font-size: 13px; text-align: center; max-width: 700px; }
  .lightbox-close {
    position: absolute; top: 22px; right: 26px; width: 40px; height: 40px; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; cursor: pointer; display: grid; place-items: center;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.12); }
  .lightbox-close svg { width: 18px; height: 18px; }

  /* ---------- 스킬 ---------- */
  .skills-layout { display: grid; grid-template-columns: .8fr .7fr 1.1fr; gap: 40px; align-items: start; border-top: 1px solid var(--border-subtle); padding-top: 28px; }
  .skill-block h3 { margin: 0 0 16px; font-size: 12px; font-weight: 700; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .8px; }
  .lang-row { margin-bottom: 14px; }
  .lang-row-head { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
  .lang-row-head .lang-percent { color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
  .lang-bar { height: 3px; background: var(--border-subtle); overflow: hidden; }
  .lang-bar i { display: block; height: 100%; background: var(--text-primary); transition: width 900ms var(--ease-out); }
  .lang-note { margin: 8px 0 0; font-size: 11.5px; color: var(--text-tertiary); line-height: 1.5; }
  .lang-range-track { height: 3px; background: var(--border-subtle); position: relative; }
  .lang-range-track::before, .lang-range-track::after { content: ""; position: absolute; top: -3px; width: 1px; height: 9px; background: var(--border-default); }
  .lang-range-track::before { left: 0; }
  .lang-range-track::after { right: 0; }
  .lang-range-dates { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
  .tool-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .tool-chips span { padding: 9px 14px; border: 1px solid var(--border-default); border-radius: var(--radius-sm); background: transparent; font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }

  .course-row { padding-bottom: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border-subtle); }
  .course-row:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
  .course-row-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
  .course-row-head span:last-child { flex: none; color: var(--text-tertiary); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .course-row p { margin: 0; font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }

  footer { margin-top: 56px; padding: 20px 0 28px; text-align: center; color: var(--text-tertiary); font-size: 11.5px; letter-spacing: .3px; border-top: 1px solid var(--border-subtle); }

  /* 기본값은 보이는 상태입니다. JS가 정상 실행됐을 때만 .reveal-pending을 추가해 페이드인 애니메이션을 적용하므로,
     스크립트 오류가 나도 콘텐츠 자체가 사라지지 않습니다. */
  .reveal.reveal-pending { opacity: 0; transform: translateY(10px); transition: opacity 640ms var(--ease-out), transform 640ms var(--ease-out); }
  .reveal.reveal-pending.is-visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 900px) {
    .hero-stage { grid-template-columns: 1fr; padding: 36px 6% 44px; }
    .hero-card { justify-self: stretch; width: 100%; }
    .competency-grid, .evidence-grid { grid-template-columns: 1fr; }
    .competency-card, .evidence-card { border-right: 0 !important; }
    .skills-layout { grid-template-columns: 1fr; gap: 28px; }
    .nav-links { display: none; }
    .nav-toggle { display: block; }
    .nav-status span.status-text { display: none; }
  }
  .nav-links.is-open { display: flex; position: absolute; top: 68px; left: 0; right: 0; flex-direction: column; padding: 10px 24px 16px; background: var(--bg-base); border-bottom: 1px solid var(--border-subtle); gap: 2px; }

  @media print {
    .site-nav, footer { display: none !important; }
    body { background: #fff; }
    .hero, .competency-card, .evidence-card { border-color: #ddd !important; }
    section { scroll-margin-top: 0; }
  }
</style>
</head>
<body>

<!-- =========================================================
     ▼▼▼ 아래 PORTFOLIO_DATA 객체의 값만 수정하면 페이지 전체 내용이 바뀝니다 ▼▼▼
     - 마크업/CSS는 건드릴 필요 없습니다.
     - 증빙자료(evidence)의 link 값에 실제 파일 URL(구글 드라이브, 노션 등)을 넣으면

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" width="20" height="20"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <div><strong id="stat2Value">18개국</strong><small id="stat2Label">담당 거래 국가</small></div>
          </div>
        </div>
        <div class="hero-tags">
          <b id="tagListLabel">핵심 역량</b>
          <span class="hero-tag-list" id="heroTagList"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="wrap">
  <section class="section" id="competency">
    <div class="section-head reveal">
      <span class="section-eyebrow">01 — Achievements</span>
      <h2>핵심 성과</h2>
    </div>
    <div class="competency-grid" id="competencyGrid"></div>
    <h3 class="work-gallery-heading" id="workGalleryHeading" style="display:none;">업무 자료</h3>
    <div class="evidence-grid" id="workGallery"></div>
  </section>
</div>

<div class="wrap">
  <section class="section" id="career">
    <div class="section-head reveal">
      <span class="section-eyebrow">02 — Career</span>
      <h2>경력 사항</h2>
    </div>
    <div class="timeline" id="careerTimeline"></div>
  </section>
</div>

<div class="wrap">
  <section class="section" id="skills">
    <div class="section-head reveal">
      <span class="section-eyebrow">03 — Skills</span>
      <h2>스킬 &amp; 교육이수</h2>
    </div>
    <div class="skills-layout reveal">
      <div class="skill-block">
        <h3>어학 역량 및 해외경험</h3>
        <div id="languageList"></div>
      </div>
      <div class="skill-block">
        <h3>업무 툴</h3>
        <div class="tool-chips" id="toolChips"></div>
      </div>
      <div class="skill-block">
        <h3>교육 이수</h3>
        <div id="courseList"></div>
      </div>
    </div>
  </section>
</div>

<footer>
  <span id="footerText"></span>
</footer>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="">
  <div class="lightbox-caption" id="lightboxCaption"></div>
</div>

<script>
(function () {
  var D = PORTFOLIO_DATA || {};

  // 섹션 하나가 데이터 오류로 실패해도 나머지 섹션은 정상 출력되도록,
  // 각 섹션을 독립된 안전 블록으로 감쌉니다. 문제가 생기면 이 함수가
  // 브라우저 콘솔(F12 > Console)에 어떤 섹션의 어떤 필드가 문제인지 알려줍니다.
  function safe(label, fn) {
    try { fn(); }
    catch (err) { console.error('[포트폴리오] "' + label + '" 섹션 렌더링 실패 — PORTFOLIO_DATA의 관련 필드를 확인하세요.', err); }
  }

  var ICONS = {
    globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    handshake: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 3 3a1 1 0 1 0 3-3l-3.7-3.7a3 3 0 0 0-4.2 0l-.5.5a1 1 0 1 1-3-3l2.5-2.5a5 5 0 0 1 7 0L21 8"/><path d="m3 8 2.5-2.5a5 5 0 0 1 3.7-1.4"/><path d="m2 9 4 4"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>',
    truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="6" width="14" height="11"/><path d="M15 9h4l3 3v5h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>',
    process: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H5a2 2 0 0 0-2 2v4"/><path d="M9 21H5a2 2 0 0 1-2-2v-4"/><path d="M15 3h4a2 2 0 0 1 2 2v4"/><path d="M15 21h4a2 2 0 0 0 2-2v-4"/><circle cx="12" cy="12" r="3"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>',
    badge: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="5"/><path d="M8.2 13 6 22l6-3 6 3-2.2-9"/></svg>',
    cert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg>',
    award: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="6"/><path d="m9 14-2 8 5-3 5 3-2-8"/></svg>',
    rocket: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09Z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2Z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>',
    linkIcon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.5-1.5"/></svg>',
    image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>'
  };

  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
  function text(id, value) { var node = document.getElementById(id); if (node && value != null) node.textContent = value; }
  function list(name) { return (D && Array.isArray(D[name])) ? D[name] : []; } // 배열 필드가 통째로 지워져도 빈 배열로 대체

  var profile = D.profile || {};
  var heroStats = D.heroStats || {};

  // ---- 브랜드 / 히어로 텍스트 ----
  safe('브랜드/히어로 텍스트', function () {
    text('brandMark', profile.initials);
    text('brandName', profile.targetCompany || profile.name);
    if (profile.role) text('brandRole', profile.role + ' 포트폴리오');
    text('navStatus', profile.statusChip);
    text('taglineLine1', profile.tagline_line1);
    text('taglineLine2', profile.tagline_line2);
    text('introText', profile.intro);
    text('heroYear', new Date().getFullYear());
  });

  // ---- 히어로 요약 카드(경력/통계/태그) ----
  safe('히어로 요약 카드', function () {
    text('headlineNumber', heroStats.headlineNumber);
    text('headlineLabel', heroStats.headlineLabel);
    text('stat1Value', heroStats.stat1Value);
    text('stat1Label', heroStats.stat1Label);
    text('stat2Value', heroStats.stat2Value);
    text('stat2Label', heroStats.stat2Label);
    text('tagListLabel', heroStats.tagListLabel);
    var tagWrap = document.getElementById('heroTagList');
    (Array.isArray(heroStats.tags) ? heroStats.tags : []).forEach(function (t) { tagWrap.appendChild(el('<span>' + t + '</span>')); });
  });

  // ---- 출력하기 버튼 ----
  safe('출력하기 버튼', function () {
    document.getElementById('printBtn').addEventListener('click', function () { window.print(); });
  });

  // ---- 핵심 역량 ----
  safe('핵심 역량', function () {
    var compGrid = document.getElementById('competencyGrid');
    list('competencies').forEach(function (c, i) {
      compGrid.appendChild(el(
        '<div class="competency-card reveal">' +
          '<span class="competency-index">0' + (i + 1) + '</span>' +
          '<div class="competency-icon">' + (ICONS[c.icon] || ICONS.target) + '</div>' +
          '<h3>' + (c.title || '') + '</h3><p>' + (c.desc || '') + '</p>' +
        '</div>'
      ));
    });
  });

  // ---- 업무 자료 갤러리 ----
  safe('업무 자료 갤러리', function () {
    var samples = list('workSamples');
    if (!samples.length) return; // 비어있으면 섹션 자체를 표시하지 않습니다.
    document.getElementById('workGalleryHeading').style.display = '';
    var gallery = document.getElementById('workGallery');
    samples.forEach(function (w) {
      var meta = w.meta ? '<p class="evidence-meta">' + w.meta + '</p>' : '';
      var item = el(
        '<div class="evidence-card work-card">' +
          '<div class="evidence-top">' +
            '<span class="evidence-icon">' + ICONS.image + '</span>' +
            '<span class="evidence-category">업무 자료</span>' +
          '</div>' +
          '<h3>' + (w.title || '') + '</h3>' +
          meta +
          '<p>' + (w.desc || '') + '</p>' +
          '<div class="evidence-footer"><span class="evidence-link">확대 보기 ' + ICONS.linkIcon + '</span></div>' +
        '</div>'
      );
      item.addEventListener('click', function () { openLightbox(w.image, (w.title || '') + (w.desc ? ' — ' + w.desc : '')); });
      gallery.appendChild(item);
    });
  });

  var lightbox = document.getElementById('lightbox');
  function openLightbox(src, caption) {
    document.getElementById('lightboxImg').src = src || '';
    document.getElementById('lightboxCaption').textContent = caption || '';
    lightbox.classList.add('is-open');
  }
  function closeLightbox() {
    lightbox.classList.remove('is-open');
    document.getElementById('lightboxImg').src = '';
  }
  safe('라이트박스', function () {
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', function (e) { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });
  });

  // ---- 경력 타임라인 ----
  safe('경력 타임라인', function () {
    var timeline = document.getElementById('careerTimeline');
    // bullets 배열의 각 항목은 문자열(단일 불릿)이거나, { title, sub: [...] } 형태(제목 + 들여쓴 하위 항목)일 수 있습니다.
    // sub 배열 안의 항목도 문자열이거나 다시 { title, sub } 객체일 수 있어 재귀적으로 처리합니다 (몇 단계든 중첩 가능).
    // 하위(sub) 항목은 굵게 처리하지 않고, 최상위 bullets 항목의 제목만 굵게 표시합니다.
    function renderSubBullet(b) {
      if (typeof b === 'string') return '<li>' + b + '</li>';
      var sub = Array.isArray(b.sub) ? '<ul class="timeline-sub">' + b.sub.map(renderSubBullet).join('') + '</ul>' : '';
      return '<li>' + (b.title || '') + sub + '</li>';
    }
    function renderBullet(b) {
      if (typeof b === 'string') return '<li>' + b + '</li>';
      var sub = Array.isArray(b.sub) ? '<ul class="timeline-sub">' + b.sub.map(renderSubBullet).join('') + '</ul>' : '';
      return '<li><strong>' + (b.title || '') + '</strong>' + sub + '</li>';
    }
    list('career').forEach(function (job) {
      var bullets = (Array.isArray(job.bullets) ? job.bullets : []).map(renderBullet).join('');
      timeline.appendChild(el(
        '<div class="timeline-item reveal">' +
          '<span class="timeline-period">' + (job.period || '') + '</span>' +
          '<h3>' + (job.company || '') + '</h3>' +
          '<span class="timeline-role">' + (job.role || '') + '</span>' +
          '<ul>' + bullets + '</ul>' +
        '</div>'
      ));
    });
  });

  // ---- 스킬 ----
  safe('어학 스킬', function () {
    var langList = document.getElementById('languageList');
    list('languages').forEach(function (l) {
      // range가 있으면 퍼센트 바 대신 시작~종료 기간을 표시합니다 (예: 워킹홀리데이 기간).
      if (l.range) {
        langList.appendChild(el(
          '<div class="lang-row">' +
            '<div class="lang-row-head"><span>' + (l.name || '') + '</span></div>' +
            '<div class="lang-range-track"></div>' +
            '<div class="lang-range-dates"><span>' + (l.range.start || '') + '</span><span>' + (l.range.end || '') + '</span></div>' +
          '</div>'
        ));
        return;
      }
      var note = l.note ? '<p class="lang-note">' + l.note + '</p>' : '';
      langList.appendChild(el(
        '<div class="lang-row">' +
          '<div class="lang-row-head"><span>' + (l.name || '') + '</span><span class="lang-percent">' + (l.level || 0) + '%</span></div>' +
          '<div class="lang-bar"><i style="width:0%" data-level="' + (l.level || 0) + '"></i></div>' +
          note +
        '</div>'
      ));
    });
  });
  safe('업무 툴 스킬', function () {
    var toolWrap = document.getElementById('toolChips');
    list('tools').forEach(function (t) { toolWrap.appendChild(el('<span>' + t + '</span>')); });
  });
  safe('교육 이수', function () {
    var courseList = document.getElementById('courseList');
    list('courses').forEach(function (c) {
      courseList.appendChild(el(
        '<div class="course-row">' +
          '<div class="course-row-head"><span>' + (c.title || '') + '</span><span>' + (c.date || '') + '</span></div>' +
          '<p>' + (c.desc || '') + '</p>' +
        '</div>'
      ));
    });
  });

  // ---- 연락처 ----
  safe('푸터', function () {
    var now = new Date();
    var yyyymm = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0');
    text('footerText', '© ' + yyyymm + '_' + (profile.name || '') + ' · Portfolio');
  });

  // ---- 모바일 메뉴 토글 ----
  var navLinks = document.getElementById('navLinks');
  safe('모바일 메뉴', function () {
    var navToggle = document.getElementById('navToggle');
    navToggle.addEventListener('click', function () { navLinks.classList.toggle('is-open'); });
    navLinks.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', function () { navLinks.classList.remove('is-open'); });
    });
  });

  // ---- 스크롤 스파이 ----
  safe('스크롤 스파이', function () {
    var sections = ['intro','career','competency','skills'].map(function (id) { return document.getElementById(id); });
    var links = Array.prototype.slice.call(navLinks.querySelectorAll('a'));
    function onScroll() {
      var pos = window.scrollY + 120;
      var current = sections[0];
      sections.forEach(function (s) { if (s && s.offsetTop <= pos) current = s; });
      links.forEach(function (l) { l.classList.toggle('is-active', current && l.getAttribute('href') === '#' + current.id); });
    }
    document.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  });

  // ---- 스크롤 reveal 애니메이션 + 언어 바 채우기 ----
  safe('스크롤 reveal 애니메이션', function () {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          entry.target.querySelectorAll('.lang-bar i').forEach(function (bar) {
            bar.style.width = bar.getAttribute('data-level') + '%';
          });
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(function (elm) { elm.classList.add('reveal-pending'); io.observe(elm); });
  });
})();
</script>

</body>
</html>
